name: Dart CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      - name: Convert coverage to lcov
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --packages=.dart_tool/package_config.json \
            --in=coverage \
            --lcov \
            --out=coverage/lcov.info \
            --report-on=lib

      - name: Enforce minimum line coverage (90%)
        run: |
          COVERAGE=$(awk '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {if (lf==0) print 0; else print (100*lh/lf)}' coverage/lcov.info)
          echo "Computed line coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { exit (cov < 90) ? 1 : 0 }'
